[project]
name = "tesla-wraps"
version = "0.1.0"
description = "Apply image directories to Tesla custom wrap templates."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
]

[project.scripts]
tesla-wraps = "teslawraps.cli:main"
tesla-wraps-web = "teslawraps.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teslawraps"]
